services:
  postgres:
    image: postgres:17
    container_name: smartpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartpay
      POSTGRES_PASSWORD: "Radhika@139"
      POSTGRES_DB: smartpay
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: smartpay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: